<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f2;
    --surface: #fbfcfa;
    --ink: #1d2423;
    --ink-soft: #414b49;
    --muted: #6c7674;
    --faint: #929a97;
    --line: #d8ded9;
    --bond: #b4bdb7;
    --accent: #bd6543;
    --accent-strong: #98492f;
    --secondary: #2f6e67;
  }
  html[data-theme="dark"] {
    --bg: #151817;
    --surface: #1b1f1d;
    --ink: #f0efe9;
    --ink-soft: #c4c8c2;
    --muted: #929b96;
    --faint: #707873;
    --line: #323835;
    --bond: #454d49;
    --accent: #df8b68;
    --accent-strong: #f0a483;
    --secondary: #78b3aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 340px;
    background: var(--bg);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: relative;
    width: 1200px; height: 340px;
    overflow: hidden;
  }
  .hairline {
    position: absolute; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 26%, var(--secondary) 26%, var(--secondary) 38%, var(--line) 38%, var(--line) 100%);
  }
  .hairline.top { top: 0; }
  .hairline.bottom { bottom: 0; transform: scaleX(-1); }

  .inner { position: absolute; inset: 0; padding: 46px 64px 42px; display: flex; flex-direction: column; justify-content: space-between; }

  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent-strong);
  }
  html[data-theme="dark"] .eyebrow { color: var(--accent); }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: 62px;
    line-height: 1.06;
    letter-spacing: -0.012em;
    color: var(--ink);
    margin-top: 16px;
  }
  h1 em { font-style: italic; color: var(--accent); }

  .meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 13.5px; color: var(--muted); letter-spacing: 0.005em;
  }
  .meta .name { color: var(--ink-soft); font-weight: 600; }
  .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); flex: none; }
  .meta .tag {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; font-size: 11.5px; font-weight: 500;
    color: var(--secondary); letter-spacing: 0.04em;
  }

  svg.motif { position: absolute; right: 0; top: 0; width: 620px; height: 340px; }
</style>
<div class="frame">
  <div class="hairline top"></div>
  <div class="hairline bottom"></div>
  <svg class="motif" viewBox="0 0 620 340" fill="none"></svg>
  <div class="inner">
    <div>
      <div class="eyebrow">Generative Models &nbsp;·&nbsp; AI for Science</div>
      <h1>Generative models for<br><em>scientific discovery.</em></h1>
    </div>
    <div class="meta">
      <span class="name">Xi Wang</span>
      <span class="dot"></span>
      <span>PhD Student in Computer Science, NYU</span>
      <span class="dot"></span>
      <span>New York, NY</span>
      <span class="tag">Courant Institute</span>
    </div>
  </div>
</div>
<script>
  document.documentElement.dataset.theme = location.hash === "#dark" ? "dark" : "light";

  // deterministic PRNG so the motif is reproducible across regenerations
  let s = 20260728;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.querySelector("svg.motif");
  const add = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    svg.appendChild(el);
    return el;
  };

  // --- crystallised structure on the right: fused bicyclic graph -------------
  const cx = 380, cy = 164, R = 48;
  const hex = (ox) => Array.from({ length: 6 }, (_, i) => {
    const a = (Math.PI / 180) * (60 * i - 30);
    return [ox + R * Math.cos(a), cy + R * Math.sin(a)];
  });
  const ringA = hex(cx);
  const ringB = hex(cx + R * Math.sqrt(3));

  const bonds = [];
  const ringBonds = (r) => r.forEach((p, i) => bonds.push([p, r[(i + 1) % 6]]));
  ringBonds(ringA); ringBonds(ringB);

  // pendant atoms
  const pend = [
    [ringA[3], [ringA[3][0] - 46, ringA[3][1] - 26]],
    [ringA[4], [ringA[4][0] - 30, ringA[4][1] + 42]],
    [ringB[0], [ringB[0][0] + 44, ringB[0][1] - 30]],
    [ringB[1], [ringB[1][0] + 30, ringB[1][1] + 40]],
  ];
  pend.forEach(([a, b]) => bonds.push([a, b]));

  bonds.forEach(([a, b]) =>
    add("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1],
      stroke: "var(--bond)", "stroke-width": 1.6, "stroke-linecap": "round" })
  );

  // double-bond inner lines for a couple of edges (chemistry cue)
  const inner = (a, b, k) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const nx = -dy / L * 5.5, ny = dx / L * 5.5;
    add("line", { x1: a[0] + nx + dx * 0.18, y1: a[1] + ny + dy * 0.18,
      x2: b[0] + nx - dx * 0.18, y2: b[1] + ny - dy * 0.18,
      stroke: "var(--bond)", "stroke-width": 1.4, "stroke-linecap": "round" });
  };
  inner(ringA[0], ringA[1]); inner(ringA[2], ringA[3]); inner(ringB[1], ringB[2]);

  const nodes = [...ringA, ...ringB, ...pend.map((p) => p[1])];
  nodes.forEach(([x, y], i) => {
    const isHetero = i === 3 || i === 8 || i === 13;
    add("circle", { cx: x, cy: y, r: isHetero ? 5.2 : 4,
      fill: isHetero ? "var(--secondary)" : "var(--accent)",
      opacity: isHetero ? 0.95 : 0.85 });
  });

  // --- noise field on the left, resolving into the structure ----------------
  for (let i = 0; i < 140; i++) {
    const x = 6 + rnd() * 296;
    const y = 24 + rnd() * 292;
    const t = Math.min(1, Math.max(0, (x - 6) / 296));      // 0 = pure noise
    // thin the field out where it would crowd the meta row in the lower left
    if (y > 244 && x < 170 && rnd() < 0.88) continue;
    const op = (0.06 + 0.30 * (1 - t)) * (0.55 + 0.45 * rnd());
    const r = 1.1 + 2.0 * rnd() * (1 - 0.4 * t);
    add("circle", { cx: x, cy: y, r, fill: "var(--ink)", opacity: op.toFixed(3) });
  }
  // a few accent-coloured particles already condensing near the structure
  for (let i = 0; i < 30; i++) {
    const x = 190 + rnd() * 145;
    const y = 38 + rnd() * 262;
    add("circle", { cx: x, cy: y, r: 1.4 + 1.6 * rnd(),
      fill: "var(--accent)", opacity: (0.12 + 0.3 * rnd()).toFixed(3) });
  }
</script>
