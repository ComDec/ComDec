name: Refresh profile cards

on:
  schedule:
    # 04:20 UTC daily — off the hour to avoid GitHub's cron rush
    - cron: "20 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  # queue rather than cancel: this job commits, and a run killed mid-push is worse
  # than a run that waits its turn
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/contributions-*.svg
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          # another run (or a manual commit) may have landed since checkout
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing and retrying ($attempt/3)"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push refreshed cards after 3 attempts"
          exit 1
